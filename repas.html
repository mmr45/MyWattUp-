<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyWattUp — Repas</title>
<style>
  :root { --vert:#1DB954; --ambre:#FFB800; --fond:#0D1117; --fond-card:#161B22; --blanc:#F5F5F0; --gris:#8B949E; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--fond); color:var(--blanc);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px 20px 100px; }
  .wrap { max-width:480px; margin:0 auto; }
  .topbar { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .back { color:var(--gris); text-decoration:none; font-size:20px; }
  h1 { font-size:19px; margin:0; }

  .day-scroll { display:flex; gap:8px; overflow-x:auto; margin-bottom:20px; padding-bottom:4px; }
  .day-chip { flex:0 0 auto; padding:9px 16px; border-radius:20px; background:var(--fond-card);
    border:1px solid rgba(255,255,255,0.08); font-size:13px; color:var(--gris); cursor:pointer; white-space:nowrap; }
  .day-chip.active { background:var(--vert); color:#04170C; border-color:var(--vert); font-weight:700; }

  .meal-card { background:var(--fond-card); border:1px solid rgba(255,255,255,0.06); border-radius:16px;
    padding:18px; margin-bottom:14px; }
  .meal-type { font-size:11px; color:var(--ambre); text-transform:uppercase; letter-spacing:0.05em; font-weight:700; margin-bottom:6px; }
  .meal-name { font-size:16px; font-weight:700; margin-bottom:4px; }
  .meal-cal { font-size:12px; color:var(--gris); margin-bottom:8px; }
  .meal-why { font-size:12px; color:var(--vert); font-style:italic; }

  .cta { width:100%; padding:14px; background:var(--vert); color:#04170C; border:none; border-radius:12px;
    font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }
  .cta.secondary { background:var(--fond-card); color:var(--blanc); border:1px solid rgba(255,255,255,0.1); margin-top:10px; }

  .empty-state { text-align:center; color:var(--gris); font-size:13px; padding:40px 20px; }

  .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--fond-card);
    border-top:1px solid rgba(255,255,255,0.06); display:flex; padding:10px 0 max(10px, env(safe-area-inset-bottom)); }
  .nav-item { flex:1; text-align:center; color:var(--gris); font-size:10px; text-decoration:none;
    display:flex; flex-direction:column; align-items:center; gap:3px; }
  .nav-item.active { color:var(--vert); }
  .nav-icon { font-size:18px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a href="/dashboard.html" class="back">←</a>
    <h1>Mes repas</h1>
  </div>

  <div class="day-scroll" id="dayScroll"></div>
  <div id="mealsList"></div>

  <button class="cta" id="generateBtn">Générer mon plan de la semaine</button>
  <button class="cta secondary" id="groceryBtn">Voir la liste de courses</button>
</div>

<nav class="bottom-nav">
  <a href="/dashboard.html" class="nav-item"><span class="nav-icon">🏠</span>Accueil</a>
  <a href="/journal.html" class="nav-item"><span class="nav-icon">📓</span>Journal</a>
  <a href="/repas.html" class="nav-item active"><span class="nav-icon">🍽️</span>Repas</a>
  <a href="/scanner.html" class="nav-item"><span class="nav-icon">📷</span>Scanner</a>
</nav>

<script type="module">
  import { supabase } from './supabaseClient.js';
  import { getCurrentUser } from './auth.js';

  const user = await getCurrentUser();
  if (!user) window.location.href = '/login.html';

  const days = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  const dayScroll = document.getElementById('dayScroll');
  const mealsList = document.getElementById('mealsList');
  let selectedDayIndex = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;

  days.forEach((d, i) => {
    const chip = document.createElement('div');
    chip.className = 'day-chip' + (i === selectedDayIndex ? ' active' : '');
    chip.textContent = d;
    chip.addEventListener('click', () => {
      selectedDayIndex = i;
      renderDayChips();
      loadMealsForDay();
    });
    dayScroll.appendChild(chip);
  });

  function renderDayChips() {
    [...dayScroll.children].forEach((chip, i) => {
      chip.classList.toggle('active', i === selectedDayIndex);
    });
  }

  // Récupère le plan de la semaine en cours (le plus récent) et ses repas
  async function loadMealsForDay() {
    mealsList.innerHTML = '<p class="empty-state">Chargement…</p>';

    const { data: plan } = await supabase
      .from('meal_plans')
      .select('id')
      .eq('user_id', user.id)
      .order('week_start', { ascending: false })
      .limit(1)
      .maybeSingle();

    if (!plan) {
      mealsList.innerHTML = '<p class="empty-state">Aucun plan de repas pour l\'instant.<br>Génère ton premier plan de la semaine ci-dessous.</p>';
      return;
    }

    const { data: meals } = await supabase
      .from('meals')
      .select('*')
      .eq('meal_plan_id', plan.id);

    if (!meals || meals.length === 0) {
      mealsList.innerHTML = '<p class="empty-state">Aucun repas généré pour ce plan.</p>';
      return;
    }

    mealsList.innerHTML = '';
    const typeLabels = { petit_dejeuner: 'Petit-déjeuner', dejeuner: 'Déjeuner', diner: 'Dîner', collation: 'Collation' };
    meals.forEach(m => {
      const card = document.createElement('div');
      card.className = 'meal-card';
      card.innerHTML = `
        <div class="meal-type">${typeLabels[m.meal_type] || m.meal_type}</div>
        <div class="meal-name">${m.name}</div>
        <div class="meal-cal">${m.ingredients || ''}</div>
      `;
      mealsList.appendChild(card);
    });
  }

  document.getElementById('generateBtn').addEventListener('click', () => {
    alert("La génération de repas via l'IA Claude n'est pas encore branchée. Elle arrivera dans une prochaine étape (Module 2 du cahier des charges).");
  });

  document.getElementById('groceryBtn').addEventListener('click', () => {
    alert("La liste de courses automatique sera générée en même temps que le plan de repas (Module 2).");
  });

  loadMealsForDay();
</script>

</body>
</html>
