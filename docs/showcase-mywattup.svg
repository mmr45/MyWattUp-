<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#D4FF3F" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#D4FF3F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF5A36" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#FF5A36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4FF3F" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#D4FF3F" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .panel { opacity: 0; animation: cycle 15s infinite; }
      .p1 { animation-delay: 0s; }
      .p2 { animation-delay: 5s; }
      .p3 { animation-delay: 10s; }
      @keyframes cycle {
        0%   { opacity: 0; transform: translateY(8px); }
        3%   { opacity: 1; transform: translateY(0); }
        30%  { opacity: 1; transform: translateY(0); }
        34%  { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; transform: translateY(-8px); }
      }
      .dot { fill: #443a2c; animation: dotOn 15s infinite; }
      .d1 { animation-delay: 0s; } .d2 { animation-delay: 5s; } .d3 { animation-delay: 10s; }
      @keyframes dotOn { 0%,33% { fill: #D4FF3F; } 34%,100% { fill: #443a2c; } }
      .ring { stroke-dasharray: 371 515; animation: draw 15s infinite; }
      @keyframes draw { 0% { stroke-dasharray: 0 515; } 12%,100% { stroke-dasharray: 371 515; } }
      .bar { animation: grow 15s infinite; transform-origin: left center; }
      @keyframes grow { 0% { transform: scaleX(0); } 14%,100% { transform: scaleX(1); } }
      .title { font-size: 15px; font-weight: 700; fill: #f3efe8; }
      .kicker { font-family: ui-monospace, 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #D4FF3F; letter-spacing: 2px; }
      .lbl { font-size: 13px; fill: #8f887c; }
      .val { font-family: ui-monospace, 'JetBrains Mono', Menlo, monospace; font-size: 13px; fill: #f3efe8; }
    ]]></style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#12100e"/>
  <ellipse cx="140" cy="40" rx="520" ry="320" fill="url(#g1)"/>
  <ellipse cx="1080" cy="400" rx="520" ry="320" fill="url(#g2)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="none" stroke="#322b22"/>

  <!-- ===================== PANNEAU 1 — Journal ===================== -->
  <g class="panel p1">
    <text x="60" y="66" class="kicker">ÉTAPE 1 SUR 5</text>
    <text x="60" y="104" font-size="30" font-weight="700" fill="#f3efe8">Journal du jour</text>
    <text x="60" y="140" class="lbl">Cinq questions, une minute. Le brouillon est sauvegardé au fur et à mesure.</text>

    <g transform="translate(60, 178)">
      <rect width="480" height="176" rx="16" fill="#1a1714" stroke="#443a2c"/>
      <text x="24" y="36" class="kicker" style="fill:#FF5A36">SOMMEIL</text>
      <text x="24" y="66" class="lbl">Heure de coucher</text>
      <rect x="24" y="78" width="200" height="42" rx="10" fill="#12100e" stroke="#D4FF3F"/>
      <text x="44" y="105" class="val">22:45</text>
      <text x="256" y="66" class="lbl">Heure de réveil</text>
      <rect x="256" y="78" width="200" height="42" rx="10" fill="#12100e" stroke="#443a2c"/>
      <text x="276" y="105" class="val" fill="#8f887c">06:15</text>
      <rect x="24" y="134" width="120" height="30" rx="15" fill="#D4FF3F"/>
      <text x="64" y="154" font-size="13" font-weight="600" fill="#12100e">Bonne</text>
      <rect x="156" y="134" width="120" height="30" rx="15" fill="#12100e" stroke="#443a2c"/>
      <text x="192" y="154" font-size="13" fill="#8f887c">Moyenne</text>
      <rect x="288" y="134" width="120" height="30" rx="15" fill="#12100e" stroke="#443a2c"/>
      <text x="322" y="154" font-size="13" fill="#8f887c">Mauvaise</text>
    </g>

    <g transform="translate(620, 178)">
      <rect width="520" height="176" rx="16" fill="#1a1714" stroke="#443a2c"/>
      <text x="24" y="36" class="kicker" style="fill:#FF5A36">ACTIVITÉ</text>
      <g font-size="12" fill="#cdc5b6">
        <rect x="24" y="52" width="150" height="52" rx="12" fill="#12100e" stroke="#D4FF3F"/>
        <text x="99" y="83" text-anchor="middle" fill="#f3efe8">Musculation</text>
        <rect x="186" y="52" width="150" height="52" rx="12" fill="#12100e" stroke="#443a2c"/>
        <text x="261" y="83" text-anchor="middle">Course à pied</text>
        <rect x="348" y="52" width="150" height="52" rx="12" fill="#12100e" stroke="#443a2c"/>
        <text x="423" y="83" text-anchor="middle">Vélo</text>
        <rect x="24" y="114" width="150" height="52" rx="12" fill="#12100e" stroke="#443a2c"/>
        <text x="99" y="145" text-anchor="middle">HIIT / Cross</text>
        <rect x="186" y="114" width="150" height="52" rx="12" fill="#12100e" stroke="#443a2c"/>
        <text x="261" y="145" text-anchor="middle">Yoga / Mobilité</text>
        <rect x="348" y="114" width="150" height="52" rx="12" fill="#12100e" stroke="#443a2c"/>
        <text x="423" y="145" text-anchor="middle">Repos</text>
      </g>
    </g>
  </g>

  <!-- ===================== PANNEAU 2 — Score ===================== -->
  <g class="panel p2">
    <text x="60" y="66" class="kicker">SCORE DU JOUR</text>
    <text x="60" y="104" font-size="30" font-weight="700" fill="#f3efe8">Une note, trois piliers</text>
    <text x="60" y="140" class="lbl">Sommeil, activité et forme ressentie croisés sur 100 points.</text>

    <g transform="translate(180, 268)">
      <circle r="86" fill="none" stroke="#322b22" stroke-width="15"/>
      <circle class="ring" r="86" fill="none" stroke="#D4FF3F" stroke-width="15" stroke-linecap="round" transform="rotate(-90)"/>
      <text y="12" text-anchor="middle" font-size="56" font-weight="700" fill="#f3efe8">72</text>
      <text y="40" text-anchor="middle" class="val" font-size="10" fill="#8f887c">/ 100</text>
    </g>

    <g transform="translate(330, 200)">
      <text x="0" y="0" class="lbl">Sommeil 7 h 30</text>
      <rect x="0" y="12" width="240" height="7" rx="3.5" fill="#322b22"/>
      <rect class="bar" x="0" y="12" width="198" height="7" rx="3.5" fill="#D4FF3F"/>
      <text x="0" y="52" class="lbl">Activité 130 min</text>
      <rect x="0" y="64" width="240" height="7" rx="3.5" fill="#322b22"/>
      <rect class="bar" x="0" y="64" width="222" height="7" rx="3.5" fill="#FF5A36"/>
      <text x="0" y="104" class="lbl">Forme ressentie 8/10</text>
      <rect x="0" y="116" width="240" height="7" rx="3.5" fill="#322b22"/>
      <rect class="bar" x="0" y="116" width="192" height="7" rx="3.5" fill="#E6FF7A"/>
    </g>

    <g transform="translate(640, 176)">
      <rect width="500" height="184" rx="16" fill="#1a1714" stroke="#443a2c"/>
      <text x="24" y="34" class="kicker" style="fill:#FF5A36">ÉVOLUTION · 7 JOURS</text>
      <g transform="translate(28, 48)">
        <path d="M0 96H444M0 60H444M0 24H444" stroke="#322b22" opacity="0.6"/>
        <path d="M0 62 C40 60 60 40 96 38 C140 36 160 84 208 88 C250 92 268 52 312 44 C356 36 388 20 444 14 L444 108 L0 108 Z" fill="url(#area)"/>
        <path d="M0 62 C40 60 60 40 96 38 C140 36 160 84 208 88 C250 92 268 52 312 44 C356 36 388 20 444 14"
              fill="none" stroke="#D4FF3F" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="444" cy="14" r="9" fill="#D4FF3F" opacity="0.2"/>
        <circle cx="444" cy="14" r="4.5" fill="#D4FF3F" stroke="#1a1714" stroke-width="2"/>
      </g>
      <text x="28" y="170" class="val" font-size="11" fill="#8f887c">Moyenne 68</text>
      <text x="472" y="170" text-anchor="end" class="val" font-size="11" fill="#D4FF3F">▲ +12 pts</text>
    </g>
  </g>

  <!-- ===================== PANNEAU 3 — Repas ===================== -->
  <g class="panel p3">
    <text x="60" y="66" class="kicker">REPAS DU JOUR</text>
    <text x="60" y="104" font-size="30" font-weight="700" fill="#f3efe8">Calés sur ta séance, pas sur une moyenne</text>
    <text x="60" y="140" class="lbl">Cible relevée de 12 % après 130 min de musculation · allergies exclues.</text>

    <g transform="translate(60, 176)">
      <rect width="340" height="184" rx="16" fill="#1a1714" stroke="#443a2c"/>
      <text x="22" y="34" class="kicker" style="fill:#FF5A36">PETIT-DÉJEUNER</text>
      <text x="22" y="64" class="title">Porridge avoine, skyr</text>
      <text x="22" y="86" class="title">et fruits rouges</text>
      <text x="22" y="116" class="val" font-size="12" fill="#D4FF3F">545 kcal</text>
      <text x="22" y="140" class="lbl" font-size="12">P 38 g · G 68 g · L 14 g</text>
      <rect x="22" y="152" width="296" height="6" rx="3" fill="#322b22"/>
      <rect class="bar" x="22" y="152" width="80" height="6" rx="3" fill="#D4FF3F"/>
    </g>

    <g transform="translate(430, 176)">
      <rect width="340" height="184" rx="16" fill="#1a1714" stroke="#443a2c"/>
      <text x="22" y="34" class="kicker" style="fill:#FF5A36">DÉJEUNER</text>
      <text x="22" y="64" class="title">Saumon grillé, quinoa</text>
      <text x="22" y="86" class="title">et carottes rôties</text>
      <text x="22" y="116" class="val" font-size="12" fill="#D4FF3F">870 kcal</text>
      <text x="22" y="140" class="lbl" font-size="12">P 46 g · G 92 g · L 30 g</text>
      <rect x="22" y="152" width="296" height="6" rx="3" fill="#322b22"/>
      <rect class="bar" x="22" y="152" width="200" height="6" rx="3" fill="#D4FF3F"/>
    </g>

    <g transform="translate(800, 176)">
      <rect width="340" height="184" rx="16" fill="#1a1714" stroke="#443a2c"/>
      <text x="22" y="34" class="kicker" style="fill:#FF5A36">DÎNER</text>
      <text x="22" y="64" class="title">Filet de porc, millet</text>
      <text x="22" y="86" class="title">et légumes verts</text>
      <text x="22" y="116" class="val" font-size="12" fill="#D4FF3F">765 kcal</text>
      <text x="22" y="140" class="lbl" font-size="12">P 44 g · G 74 g · L 26 g</text>
      <rect x="22" y="152" width="296" height="6" rx="3" fill="#322b22"/>
      <rect class="bar" x="22" y="152" width="296" height="6" rx="3" fill="#D4FF3F"/>
    </g>
  </g>

  <!-- indicateur -->
  <g transform="translate(566, 392)">
    <circle class="dot d1" cx="0" cy="0" r="4"/>
    <circle class="dot d2" cx="18" cy="0" r="4"/>
    <circle class="dot d3" cx="36" cy="0" r="4"/>
  </g>
</svg>
