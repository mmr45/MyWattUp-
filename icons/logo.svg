<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="55%" stop-color="#14161a"/>
      <stop offset="100%" stop-color="#0b0c0f"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8af0b3"/>
      <stop offset="45%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#178a4c"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGlow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="216" fill="none" stroke="#2a2f38" stroke-width="4"/>

  <!-- signature mark: a W built from a single lightning stroke (watt = energy, W = brand) -->
  <g filter="url(#softGlow)">
    <path d="M 234 322
             L 372 706
             L 512 378
             L 652 706
             L 790 322"
          fill="none"
          stroke="url(#boltGrad)"
          stroke-width="70"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
  <g filter="url(#softGlow)" opacity="0.9">
    <!-- small bolt tip accent through the peak, nodding to "watt" -->
    <path d="M 546 452 L 486 560 L 528 560 L 484 660"
          fill="none"
          stroke="#eafff2"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
