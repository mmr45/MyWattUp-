<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyWattUp — Dashboard</title>
<style>
  :root {
    --vert: #1DB954;
    --ambre: #FFB800;
    --fond: #0D1117;
    --fond-card: #161B22;
    --blanc: #F5F5F0;
    --gris: #8B949E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fond);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(29,185,84,0.08), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(255,184,0,0.07), transparent 40%);
    color: var(--blanc);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 20px 100px;
  }

  .wrap { max-width: 480px; margin: 0 auto; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .brand-icon {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--fond-card);
    border: 2px solid var(--ambre);
    display: flex; align-items: center; justify-content: center;
    color: var(--vert);
    font-size: 16px;
  }

  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; }

  .logout {
    color: var(--gris);
    font-size: 12px;
    cursor: pointer;
    background: none;
    border: none;
    text-decoration: underline;
  }

  /* Anneau de score */
  .score-card {
    background: var(--fond-card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    margin-bottom: 20px;
  }

  .ring-wrap { position: relative; width: 180px; height: 180px; margin: 0 auto 16px; }

  .ring-wrap svg { transform: rotate(-90deg); }

  .ring-bg { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 12; }
  .ring-fg {
    fill: none;
    stroke: var(--vert);
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s ease;
  }

  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .ring-score { font-size: 42px; font-weight: 800; letter-spacing: -0.03em; }
  .ring-label { font-size: 11px; color: var(--gris); text-transform: uppercase; letter-spacing: 0.06em; }

  .score-date { color: var(--gris); font-size: 13px; }

  /* Mini-cartes */
  .mini-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .mini-card {
    background: var(--fond-card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
  }

  .mini-icon { font-size: 20px; margin-bottom: 6px; }
  .mini-value { font-size: 20px; font-weight: 700; }
  .mini-label { font-size: 10px; color: var(--gris); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  .mini-card.sommeil .mini-value { color: var(--ambre); }
  .mini-card.activite .mini-value { color: var(--vert); }
  .mini-card.repas .mini-value { color: var(--blanc); }

  /* Conseil du jour */
  .advice-card {
    background: linear-gradient(135deg, rgba(29,185,84,0.10), rgba(255,184,0,0.06));
    border: 1px solid rgba(29,185,84,0.20);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .advice-eyebrow {
    font-size: 11px;
    color: var(--vert);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .advice-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--blanc);
  }

  .advice-placeholder-tag {
    display: inline-block;
    margin-top: 10px;
    font-size: 10px;
    color: var(--gris);
    background: rgba(255,255,255,0.05);
    padding: 3px 8px;
    border-radius: 6px;
  }

  /* Journal du jour CTA */
  .journal-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--vert);
    color: #04170C;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }

  .empty-state {
    text-align: center;
    color: var(--gris);
    font-size: 13px;
    padding: 20px 0;
  }

  /* Nav bas */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--fond-card);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    padding: 10px 0 max(10px, env(safe-area-inset-bottom));
  }

  .nav-item {
    flex: 1;
    text-align: center;
    color: var(--gris);
    font-size: 10px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .nav-item.active { color: var(--vert); }
  .nav-icon { font-size: 18px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-name">MyWattUp</div>
    </div>
    <button class="logout" id="logoutBtn">Déconnexion</button>
  </div>

  <div class="score-card">
    <div class="ring-wrap">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle class="ring-bg" cx="90" cy="90" r="78" />
        <circle class="ring-fg" id="ringFg" cx="90" cy="90" r="78"
          stroke-dasharray="490" stroke-dashoffset="490" />
      </svg>
      <div class="ring-center">
        <div class="ring-score" id="scoreValue">--</div>
        <div class="ring-label">Score du jour</div>
      </div>
    </div>
    <div class="score-date" id="scoreDate"></div>
  </div>

  <div class="mini-grid">
    <div class="mini-card sommeil">
      <div class="mini-icon">🌙</div>
      <div class="mini-value" id="sleepValue">--</div>
      <div class="mini-label">Sommeil</div>
    </div>
    <div class="mini-card activite">
      <div class="mini-icon">🔥</div>
      <div class="mini-value" id="activityValue">--</div>
      <div class="mini-label">Activité</div>
    </div>
    <div class="mini-card repas">
      <div class="mini-icon">🍽️</div>
      <div class="mini-value" id="mealsValue">--</div>
      <div class="mini-label">Repas suivis</div>
    </div>
  </div>

  <div class="advice-card">
    <div class="advice-eyebrow">Conseil du jour</div>
    <div class="advice-text" id="adviceText">
      Remplis ton journal du jour pour recevoir ton premier conseil personnalisé.
    </div>
    <span class="advice-placeholder-tag">⚙️ Texte statique — IA Claude à brancher</span>
  </div>

  <a href="/journal.html" class="journal-btn">Remplir mon journal du jour</a>
</div>

<nav class="bottom-nav">
  <a href="/dashboard.html" class="nav-item active">
    <span class="nav-icon">🏠</span>Accueil
  </a>
  <a href="/journal.html" class="nav-item">
    <span class="nav-icon">📓</span>Journal
  </a>
  <a href="/repas.html" class="nav-item">
    <span class="nav-icon">🍽️</span>Repas
  </a>
  <a href="/scanner.html" class="nav-item">
    <span class="nav-icon">📷</span>Scanner
  </a>
</nav>

<script type="module">
  import { supabase } from './supabaseClient.js';
  import { getCurrentUser, signOut } from './auth.js';

  const user = await getCurrentUser();
  if (!user) {
    window.location.href = '/login.html';
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await signOut();
    window.location.href = '/login.html';
  });

  // ============================================
  // RÉCUPÉRER LE LOG DU JOUR
  // (table daily_logs : sleep_score, activity_score, daily_score)
  // ============================================
  const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD

  const { data: log, error } = await supabase
    .from('daily_logs')
    .select('*')
    .eq('user_id', user.id)
    .eq('log_date', today)
    .maybeSingle();

  if (error) {
    console.error("Erreur récupération du log du jour :", error.message);
  }

  const scoreDate = document.getElementById('scoreDate');
  scoreDate.textContent = new Date().toLocaleDateString('fr-FR', {
    weekday: 'long', day: 'numeric', month: 'long'
  });

  if (log) {
    // Score dans l'anneau
    const score = log.daily_score ?? 0;
    document.getElementById('scoreValue').textContent = score;

    const circumference = 2 * Math.PI * 78; // ~490
    const offset = circumference - (score / 100) * circumference;
    document.getElementById('ringFg').style.strokeDashoffset = offset;

    // Mini-cartes
    document.getElementById('sleepValue').textContent = log.sleep_score ?? '--';
    document.getElementById('activityValue').textContent = log.activity_score ?? '--';
    const mealsCount = [log.breakfast_done, log.lunch_done, log.dinner_done].filter(Boolean).length;
    document.getElementById('mealsValue').textContent = mealsCount + '/3';

    // Conseil du jour : ai_recommendation si présent, sinon placeholder
    const adviceText = document.getElementById('adviceText');
    if (log.ai_recommendation) {
      adviceText.textContent = log.ai_recommendation;
    } else {
      adviceText.textContent = "Ton score du jour est calculé. Le conseil personnalisé par l'IA arrivera bientôt ici.";
    }
  } else {
    // Aucun log aujourd'hui : état vide
    document.getElementById('scoreValue').textContent = '--';
    document.getElementById('sleepValue').textContent = '--';
    document.getElementById('activityValue').textContent = '--';
    document.getElementById('mealsValue').textContent = '--';
  }
</script>

</body>
</html>
